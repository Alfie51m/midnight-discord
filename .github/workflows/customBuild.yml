name: Build custom theme

# Rebuilds custom/midnight-custom.theme.css from the author's latest theme (downloaded from
# refact0r/midnight-discord) with the changes in custom/ applied.
# Runs every day (after the author's own class update at 00:00 UTC), whenever custom/ changes,
# and on demand from the Actions tab ("Run workflow").
# On pull requests it only checks that the theme still builds, without committing anything.

on:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [master]
    paths:
      - "custom/**"
      - "!custom/midnight-custom.theme.css"
      - ".github/workflows/customBuild.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: custom-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # the author's latest theme, kept in his folder layout in .midnight (git-ignored; the action only accepts folders inside the checkout)
      - name: Download midnight
        run: |
          mkdir -p ".midnight/build" ".midnight/themes"
          curl -fsSL -o ".midnight/build/midnight.css" https://raw.githubusercontent.com/refact0r/midnight-discord/master/build/midnight.css
          curl -fsSL -o ".midnight/themes/midnight.theme.css" https://raw.githubusercontent.com/refact0r/midnight-discord/master/themes/midnight.theme.css

      # update Discord class names with the same bot and rename list the author uses, on both his theme and
      # your files, so the two always match even if the list changed since his own daily update.
      # Pinned to an exact commit (v3) so the action only changes when you choose to update it.
      - name: Rename classes in midnight
        uses: refact0r/class-update@91c225aaafcf7f7bc7032a8855d65eca05a6952b # v3
        with:
          folder: .midnight
          ext: css
          diff: https://raw.githubusercontent.com/SyndiShanX/Update-Classes/main/Changes.txt
      - name: Rename classes in custom rules
        uses: refact0r/class-update@91c225aaafcf7f7bc7032a8855d65eca05a6952b # v3
        with:
          folder: custom
          ext: css
          diff: https://raw.githubusercontent.com/SyndiShanX/Update-Classes/main/Changes.txt
      - name: Rename classes in custom patches
        uses: refact0r/class-update@91c225aaafcf7f7bc7032a8855d65eca05a6952b # v3
        with:
          folder: custom
          ext: json
          diff: https://raw.githubusercontent.com/SyndiShanX/Update-Classes/main/Changes.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # applies your changes to the renamed theme; fails (and GitHub emails you) if one of your changes
      # no longer applies, leaving the last good theme file in place
      - name: Build theme
        run: node custom/build.mjs
        env:
          MIDNIGHT_DIR: .midnight

      # opens an issue when the author changes styling for a class our own rules or patches also use: the build
      # can't catch those clashes, since nothing fails. Records his latest commit in custom/upstream.json.
      - name: Check the author's changes against ours
        if: github.event_name != 'pull_request'
        run: node custom/watch-upstream.mjs
        env:
          REPORT_FILE: .midnight/upstream-report.md
      # needs Issues turned on in the repository settings; if it fails, the theme is still committed
      - name: Open an issue about them
        if: github.event_name != 'pull_request' && hashFiles('.midnight/upstream-report.md') != ''
        continue-on-error: true
        run: gh issue create --title "midnight changed styling our customisations also use" --body-file .midnight/upstream-report.md
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        if: github.event_name != 'pull_request'
        with:
          default_author: github_actions
          message: "build custom theme"
          add: custom
          fetch: true

      # GitHub pauses scheduled workflows after 60 days without activity in the repository, and this build only
      # commits when something changes. If the last commit is over 50 days old, add an empty one to keep it running.
      - name: Keep the daily build active
        if: github.event_name != 'pull_request'
        run: |
          git pull --quiet --ff-only
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was $age days ago."
          if [ "$age" -ge 50 ]; then
            git config user.name "github-actions"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keep the scheduled build active"
            git push
          fi

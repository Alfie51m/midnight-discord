name: Build custom theme

# Rebuilds custom/midnight-custom.theme.css from the author's latest theme (downloaded from
# refact0r/midnight-discord) with the changes in custom/ applied.
# Runs every day (after the author's own class update at 00:00 UTC), whenever custom/ changes,
# and on demand from the Actions tab ("Run workflow").

on:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [master]
    paths:
      - "custom/**"
      - "!custom/midnight-custom.theme.css"
      - ".github/workflows/customBuild.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: custom-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # keep Discord class names in your own rules and patches current, with the same bot and
      # rename list the author uses for his theme
      - uses: refact0r/class-update@v3
        with:
          folder: custom
          ext: css
          diff: https://raw.githubusercontent.com/SyndiShanX/Update-Classes/main/Changes.txt
      - uses: refact0r/class-update@v3
        with:
          folder: custom
          ext: json
          diff: https://raw.githubusercontent.com/SyndiShanX/Update-Classes/main/Changes.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # downloads the author's latest theme and applies your changes; fails (and GitHub emails you)
      # if one of your changes no longer applies, leaving the last good theme file in place
      - run: node custom/build.mjs

      - uses: EndBug/add-and-commit@v10
        with:
          default_author: github_actions
          message: "build custom theme"
          add: custom
          fetch: true
